name: iOS IPA

# Same reason as the Android workflow: the machine this is developed on runs
# Windows and has no Xcode, so CI is the compiler. Every push builds an
# UNSIGNED ipa and publishes it, together with an AltStore/SideStore source
# manifest, to the rolling `ios-latest` prerelease. SideStore signs the ipa on
# the phone with the user's own free Apple ID, so no signing identity, profile
# or secret is ever needed here.
on:
  push:
    paths:
      - 'ios/**'
      - 'tools/ios/**'
      - 'tools/parity/**'
      - 'data/parity/**'
      - 'android/app/src/main/assets/v46_21_profile.json'
      - '.github/workflows/ios.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ios
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Stamp the commit into the build
        run: |
          sed -i '' "s/\"dev\"/\"${GITHUB_SHA:0:7}\"/" ios/Sources/BuildInfo.swift
          grep 'static let commit' ios/Sources/BuildInfo.swift

      - name: Generate the Xcode project
        working-directory: ios
        run: xcodegen generate

      # Runs before the build on purpose: a byte map that no longer agrees with
      # the raw Diagbox database must not reach a phone.
      - name: Parity test against the recorded frames
        working-directory: ios
        run: |
          set -o pipefail
          # The udid, not the name: the runners carry several iOS runtimes at
          # once, so "iPhone 17" resolves to three destinations and xcodebuild
          # bails out with code 70 before compiling anything.
          sim="$(python3 ../tools/ios/pick_simulator.py)"
          echo "simulator udid: $sim"
          xcodebuild test \
            -project Valeo.xcodeproj \
            -scheme Valeo \
            -destination "platform=iOS Simulator,id=$sim" \
            -derivedDataPath build-test \
            CODE_SIGNING_ALLOWED=NO \
            | tee test.log
          grep 'parity:' test.log | tail -1

      - name: Build (unsigned)
        working-directory: ios
        run: |
          xcodebuild \
            -project Valeo.xcodeproj \
            -scheme Valeo \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            MARKETING_VERSION="1.0.${{ github.run_number }}" \
            CURRENT_PROJECT_VERSION="${{ github.run_number }}" \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Package the ipa
        run: |
          app="ios/build/Build/Products/Release-iphoneos/Valeo.app"
          test -d "$app" || { echo "no .app at $app"; exit 1; }
          # An ipa is just a zip with the .app inside a Payload/ directory.
          rm -rf Payload valeo-ios.ipa
          mkdir Payload
          cp -R "$app" Payload/
          zip -qry valeo-ios.ipa Payload
          ls -lh valeo-ios.ipa

      - name: Write the SideStore source manifest
        run: |
          python3 tools/ios/make_source.py \
            --ipa valeo-ios.ipa \
            --version "1.0.${{ github.run_number }}" \
            --commit "${GITHUB_SHA:0:7}" \
            --repo "${GITHUB_REPOSITORY}" \
            --out source.json
          cat source.json

      - name: Publish to the rolling ios-latest release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view ios-latest >/dev/null 2>&1 || gh release create ios-latest \
            --prerelease \
            --title "iOS (unsigned, for SideStore)" \
            --notes "Unsigned ipa, signed on-device by SideStore. Rolling tag: always the latest main."
          gh release upload ios-latest valeo-ios.ipa source.json --clobber

      - uses: actions/upload-artifact@v4
        with:
          name: ipa
          path: |
            valeo-ios.ipa
            source.json
          if-no-files-found: error
