name: Android APK

# The machine this is developed on has no JDK and no Android SDK, so CI is the
# compiler.
#
# MOTHBALLED 2026-09-10. The iOS app is the product; the Android client is
# frozen and no longer developed, so this no longer runs on push - a red build
# nobody intends to fix only costs attention. Kept, and still runnable by hand,
# because freezing is not deleting.
#
# To revive it: the generated profile moved to data/profile/v46_21_profile.json,
# so `Profile.fromAssets` and the two paths in ParityTest.kt need pointing at
# it (or the file copying back into the app's assets), and the push trigger
# needs restoring.
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('android/**/*.gradle*', 'android/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: gradle-

      # Before the APK on purpose: the parity fixture is the only thing that
      # holds this decoder and the iOS one to the same byte maps, so a
      # divergence must not reach a phone.
      - name: Parity test against the recorded frames
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon test

      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug

      - name: Name the APK after the commit
        working-directory: android
        run: |
          mkdir -p out
          cp app/build/outputs/apk/debug/app-debug.apk \
             "out/valeo-v46-21-${GITHUB_SHA::7}.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: apk
          path: android/out/*.apk
          if-no-files-found: error
