# XcodeGen manifest. The .xcodeproj is NOT checked in: this project is edited on
# a Windows machine with no Xcode, so the project file is generated on the CI
# runner instead of being hand-maintained.
name: Valeo

options:
  bundleIdPrefix: com.fap
  createIntermediateGroups: true
  deploymentTarget:
    iOS: "17.0"

settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    CODE_SIGN_STYLE: Manual
    CODE_SIGNING_REQUIRED: NO
    CODE_SIGNING_ALLOWED: NO
    TARGETED_DEVICE_FAMILY: "1,2"

targets:
  Valeo:
    type: application
    platform: iOS
    sources:
      - path: Sources
      - path: Resources
      # The generated profile, straight from tools/diagbox/make_profile.py.
      # It used to live in the Android app's assets and be shared three ways;
      # with the Android and web clients mothballed it sits in data/profile,
      # where its owner is not in question. Referenced in place, never copied.
      - path: ../data/profile/v46_21_profile.json
        type: file
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.fap.modern
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_USER_SCRIPT_SANDBOXING: NO
    info:
      path: Info.plist
      properties:
        CFBundleDisplayName: Valeo V46.21
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        # BLE is the only transport an iPhone can use for an ELM327 clone:
        # classic SPP needs MFi hardware.
        NSBluetoothAlwaysUsageDescription: >-
          Нужен для связи с адаптером ELM327, подключённым к машине.
        # The stream has to survive a locked screen: without this the app is
        # suspended, and across a suspension the ECU drops its diagnostic
        # session (out/drives/2026-09-10_ios_baseline.md). Central role only -
        # the app connects out to the adapter, it never advertises.
        UIBackgroundModes:
          - bluetooth-central
        # Drive logs land in Documents and are picked up from the Files app.
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
        ITSAppUsesNonExemptEncryption: false
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight

  # Not hosted by the app on purpose: the core files are compiled straight into
  # the test bundle, so `xcodebuild test` needs no app install and no signing.
  ValeoTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests
      - path: Sources/Frames.swift
      - path: Sources/Profile.swift
      - path: Sources/Reading.swift
      - path: Sources/LinkTransport.swift
      - path: Sources/AdapterStore.swift
      - path: Sources/ElmSession.swift
      - path: Sources/AsyncLock.swift
      # Referenced by ElmSession, so the test bundle needs them to link.
      - path: Sources/DeviceAwake.swift
      - path: Sources/StallReminder.swift
      - path: Sources/Adapter.swift
      - path: Sources/ElmAdapter.swift
      # The ThinkDiag `55aa` codec. Pure value types with no transport under
      # them, which is the whole reason it is worth having as its own file: it
      # is the one part of that adapter CI can prove without the car.
      - path: Sources/ThinkDiagFrame.swift
      - path: Sources/ThinkDiagIdentity.swift
      - path: Sources/ThinkDiagHandshake.swift
      - path: Sources/ThinkDiagRequest.swift
      - path: Sources/ThinkDiagAdapter.swift
      - path: Sources/ThinkDiagScriptStore.swift
      - path: Sources/Sample.swift
      - path: Sources/CsvLogger.swift
      - path: Sources/CsvFile.swift
      - path: Sources/TechLog.swift
      - path: Sources/PagePlan.swift
      - path: Sources/Drive.swift
      - path: ../data/parity/golden.json
        type: file
        buildPhase: resources
      - path: ../data/profile/v46_21_profile.json
        type: file
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.fap.modern.tests
        GENERATE_INFOPLIST_FILE: YES

schemes:
  Valeo:
    build:
      targets:
        Valeo: all
        ValeoTests: [test]
    test:
      targets:
        - ValeoTests
